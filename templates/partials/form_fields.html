{% for error in form.non_field_errors %}<div class="err" style="margin-bottom:14px">{{ error }}</div>{% endfor %}
{% for field in form %}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% for error in field.errors %}<div class="err">{{ error }}</div>{% endfor %}
</div>
{% endfor %}
